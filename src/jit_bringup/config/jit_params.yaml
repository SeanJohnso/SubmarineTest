# Parameters for the JIT submarine stack, keyed by node name (no namespace).
#
# Edit calibration values here as they are measured on the bench, then `git pull`
# on the Pi - no rebuild is needed for a params-only change.
#
# The mission waypoints are NOT in this file. See config/waypoints.yaml.

# ===========================================================================
# jit_safety
# ===========================================================================

crsf_channel_node:
  ros__parameters:
    serial_port: /dev/ttyAMA0
    poll_rate_hz: 50.0
    # Must match the ELRS receiver's configured CRSF baud (the standard is 420000).
    crsf_baud: 115200
    # 0-based index of the 3-position mode switch in the 16-channel array.
    mode_channel_index: 7
    # Detent bands, raw CRSF counts. Detents observed at ~191 / ~997 / ~1792.
    #   below neutral_low  -> DOWN = ESTOP
    #   inside the band    -> MID  = MANUAL
    #   above neutral_high -> UP   = LOCAL_GUIDED
    neutral_low: 700
    neutral_high: 1300
    # Declared but not yet enforced (see the link_healthy() TODO).
    min_link_quality: 50

    # --- Submerged link-loss suppression ---
    # While nav/local/submerged is true, fresher than submerged_timeout_s, AND
    # the RC link is actually down, this node holds crsf/relay_permit true and
    # holds mode/request at the last detent read from a live link. With a live
    # link it changes nothing - the ESTOP detent still cuts the relay.
    submerged_timeout_s: 0.5
    # BACKSTOP: the longest this node will hold that permit over a real link
    # loss, whatever the topic says. Intentionally longer than
    # local_guided_node's max_submerged_s so the requester normally gives up
    # first and this only fires if that node is wrong or hung. Do not set 0.
    max_link_loss_suppress_s: 150.0

gpio_estop_node:
  ros__parameters:
    gpio_chip: gpiochip0
    # Relay coil drive. BCM23 / header pin 16. HIGH = coil energized = rail live.
    relay_cmd_line_offset: 23
    # Relay feedback from the LDO on the switched battery rail.
    # BCM18 / header pin 12. HIGH = rail actually live. Biased pull-down in
    # software - there is no external resistor - so a broken wire reads "dead".
    relay_feedback_line_offset: 18
    # Force the relay open if either permit goes stale for this long.
    watchdog_timeout_ms: 500
    # How long to wait after a commanded change before believing the feedback.
    # Covers relay actuation plus the LDO's output-capacitance discharge, which
    # is the slower of the two edges. Too short = spurious RELAY_NOT_CLOSED on
    # every legitimate open.
    relay_settle_ms: 300
    # Welded-relay check at startup. Fatal on failure - the launch aborts.
    # Only set false for bench work with no relay or no LDO connected.
    boot_selftest: true
    status_heartbeat_hz: 2.0
    evaluate_hz: 20.0

system_monitor_node:
  ros__parameters:
    # crsf_channel_node publishes crsf/link_ok every poll cycle no matter what,
    # so silence past this means that process died.
    crsf_heartbeat_timeout_s: 0.5
    estop_timeout_s: 1.5
    mavros_timeout_s: 3.0
    mode_request_timeout_s: 0.5
    # How long the guided mission sits at COMPLETE, station-keeping, before the
    # MISSION_COMPLETE fault fires and the vehicle mission-safes.
    hold_timeout_s: 5.0
    evaluate_hz: 10.0
    # The relay permit, on its own callback group under a multi-threaded
    # executor so nothing else in the node can delay it.
    safety_hz: 20.0
    # How stale nav/local/submerged may be and still suppress RC_LINK_LOST.
    # Only RC_LINK_LOST is ever suppressed - CRSF_NODE_DEAD, MAVROS_LOST,
    # ESTOP_NODE_DEAD and the relay faults all still fire while submerged.
    submerged_timeout_s: 0.5
    # NOTE-1: only DISARM is implemented. HOLD and SURFACE are placeholders for
    # the autonomy work. Relaxing this alone changes nothing - link loss also
    # withdraws crsf/relay_permit inside crsf_channel_node, which opens the
    # relay in hardware. Both knobs have to move together.
    link_loss_action: DISARM

# ===========================================================================
# jit_ui
# ===========================================================================

led_driver_node:
  ros__parameters:
    # Single-wire (WS281x-style) addressable panel. BCM13 = PWM channel 1,
    # header pin 33 - deliberately NOT BCM18, which gpio_estop_node already
    # owns as the relay feedback input. pwm_channel must match whichever
    # hardware PWM channel gpio_pin belongs to (0: BCM12/BCM18, 1: BCM13/
    # BCM19). Unmeasured defaults - verify against the actual wiring.
    gpio_pin: 13
    pwm_channel: 1
    dma_channel: 10
    led_count: 256
    freq_hz: 800000
    brightness: 64
    invert: false
    # Wire colour order. WS2812B is almost always GRB; change if the panel
    # shows the wrong colour for a known pattern.
    strip_type: GRB

# ===========================================================================
# jit_control
# ===========================================================================

vehicle_interface_node:
  ros__parameters:
    # Our MANUAL maps to ArduSub STABILIZE: auto-levelled roll and pitch with
    # manual throttle and yaw. Set MANUAL for raw passthrough.
    manual_ardusub_mode: STABILIZE
    guided_ardusub_mode: GUIDED
    # What we fall back to when safing. Must NOT be GUIDED - a GUIDED position
    # target has no staleness timeout, so leaving the mode is the only thing
    # that actually clears it.
    safing_mode: STABILIZE

    health_timeout_s: 0.5
    mode_timeout_s: 0.5
    mavros_timeout_s: 3.0
    # If the active command source goes quiet for this long it has died - safe
    # rather than coast on a stale command.
    cmd_timeout_s: 0.5
    arm_hold_s: 0.75
    mode_arm_retry_s: 1.0
    send_rate_hz: 20.0

    # --- Disarm: project standing rule ---
    # Retry until /mavros/state.armed reads false, and send at least this many
    # commands regardless. Never a single fire-and-forget disarm.
    disarm_retry_hz: 5.0
    min_disarm_commands: 2

    # Manual arm precondition: both sticks within this of centre.
    arm_stick_epsilon: 60.0
    z_neutral: 500.0

    # --- Guided setpoint dedupe ---
    # An ArduSub guided position target is a ONE-SHOT command, not a stream.
    # Each SET_POSITION_TARGET_LOCAL_NED re-anchors AC_WPNav's leg and restarts
    # its s-curve at zero velocity, so streaming at send_rate_hz pinned the
    # commanded speed near zero: the sub yawed onto the track bearing and then
    # sat there. Forward a target only when it moves by more than these
    # thresholds, in a short burst to cover MAVLink loss, then stay quiet.
    setpoint_epsilon_m: 0.05
    setpoint_yaw_epsilon_rad: 0.02
    setpoint_burst_count: 2
    setpoint_burst_interval_s: 0.05

manual_control_node:
  ros__parameters:
    # --- channel selection ---
    fwd_channel_index: 2          # CRSF index 2 -> MANUAL_CONTROL x (fwd/rev)
    yaw_channel_index: 3          # CRSF index 3 -> MANUAL_CONTROL r (yaw)

    # --- per-axis calibration (raw CRSF counts) ---
    fwd_raw_min: 191.0
    fwd_raw_center: 997.0
    fwd_raw_max: 1792.0
    fwd_deadband: 40.0            # in MANUAL_CONTROL counts (+/-1000 domain)
    fwd_invert: false             # index 2 high = forward

    yaw_raw_min: 191.0
    yaw_raw_center: 997.0
    yaw_raw_max: 1792.0
    yaw_deadband: 40.0
    yaw_invert: false             # index 3 high = yaw right

    # --- command shaping ---
    z_neutral: 500.0              # ArduSub vertical axis neutral ([0,1000])
    send_rate_hz: 20.0
    slew_max_per_s: 0.0           # 0 = disabled; counts/s ramp limit on x and r

    axes_timeout_s: 0.4
    bus_timeout_s: 0.5

local_guided_node:
  ros__parameters:
    # waypoint_file is set by the launch file - see config/waypoints.yaml.
    # Acceptance mirrors ArduPilot's verify_nav_wp(): touch the ball once, then
    # dwell. Distance is NOT re-checked during the dwell.
    #
    # 0.3 m is tight for a DVL-backed estimate - ArduPilot's own default is
    # 2.0 m and its floor is 0.05 m. If "reached" never fires at the pool, open
    # this up rather than chasing the estimator.
    radius_m: 0.3
    dwell_s: 1.0
    # Vertical acceptance, applied ONLY on a leg that commands a depth change.
    # A level leg ignores depth error exactly as before, so the persistent trim
    # error seen holding entry depth on the surface still cannot block a
    # waypoint. Without this, a dive waypoint directly below the datum has a
    # horizontal distance of ~0 and is "reached" before the vehicle descends.
    depth_radius_m: 0.3
    # GUIDED position targets do not expire, so this rate is for message-loss
    # robustness, not to satisfy a firmware timeout.
    setpoint_rate_hz: 10.0
    pose_timeout_s: 1.0
    bus_timeout_s: 0.5

    # --- Submerged operation ---
    # Below this many metres from the entry depth, by command or measurement,
    # the node asserts nav/local/submerged and the RC link-loss failsafe is
    # relaxed. Wants to be SHALLOWER than the depth at which the antenna goes
    # under, so the flag is live at both consumers before the link drops.
    submerge_threshold_m: 0.2
    # DEADMAN. The longest the flag may be asserted in one continuous stretch.
    # While it is asserted and the link is down there is NO operator stop, so
    # this is the primary bound on the whole behaviour. On expiry the flag drops
    # and the mission ABORTs. Set this from the dive you actually intend to fly
    # plus a margin - not generously. 0 disables it; do not dive like that.
    max_submerged_s: 120.0
    # Inside this distance the bearing to the target is mostly estimator noise,
    # so hold the last commanded heading instead of spinning.
    yaw_hold_radius_m: 0.5

global_guided_node:
  ros__parameters:
    # Skeleton node. Publishes nav/global/status = IDLE and nothing else.
    status_rate_hz: 10.0
