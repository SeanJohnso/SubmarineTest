# The sub's network configuration: the two DDS domains, the topics bridged
# between them, and the network addresses DDS may use. Read by domain_bridge
# itself and, through jit_network.py, by domain_bridge.launch.py,
# mavros.launch.py and jit_bringup.launch.py.
#
# WHY
# On the shared domain MAVROS took 3-37 s per plugin to start, because every
# entity it creates is matched against every robot on the network. On a private
# domain it starts normally. The bridge carries only the topics listed here
# across, so the shared domain sees a handful of topics instead of all of
# MAVROS, and other robots cannot publish into /mavros/* or jit/*.
#
# DOMAINS
# from_domain is the shared domain, to_domain the sub's private one. Each of the
# three launches sets ROS_DOMAIN_ID to to_domain for its own processes. A plain
# entry goes shared -> sub; "reversed: true" goes sub -> shared;
# "bidirectional: true" goes both ways (the bridge ignores its own
# publications, so it does not loop).
#
# QOS
# An entry without qos waits for a publisher and copies its reliability and
# durability, so MAVROS's best-effort streams stay best-effort and the latched
# jit/task/* topics stay latched.
#
# Topics are taken from what the boat's code subscribes to (juniorsim:
# jit_heartbeat heartbeat_node, robotx_tasks infrastructure_node) and what the
# sub's waypoint_listener_node needs. Add a topic here if the other side needs
# one that is not listed.

name: jit_bridge
from_domain: 56
to_domain: 77

# Read by jit_network.py, ignored by domain_bridge itself.
network:
  # The only addresses Fast DDS may use for UDP, for the bridge, MAVROS and the
  # stack, on both domains. jit_network.py writes a Fast DDS profile from it.
  # wlan0 is left out on purpose, so no DDS traffic goes out on the Wi-Fi.
  # Fast DDS 2.6 (Humble) matches addresses, not interface names: if eth0's
  # static address changes, change it here. Same-host traffic uses shared
  # memory; loopback stays allowed for anything on this Pi that falls back to UDP.
  allowed_addresses:
    - 127.0.0.1      # loopback
    - 201.7.90.101   # eth0: BlueOS and the boat

topics:
  # ---- shared -> sub ------------------------------------------------------

  # The mission list for waypoint_listener_node.
  rviz/waypoints:
    type: nav_msgs/msg/Path

  # All TF from the shared domain. waypoint_listener_node needs
  # map -> jit/local_origin.
  tf:
    type: tf2_msgs/msg/TFMessage

  # Both ways. In: the boat's static frames. Out: map -> jit/local_origin from
  # jit_datum_node on the sub, which the boat's infrastructure_node needs to put
  # the sub's pose into its map.
  # Depth 100: one bridge publisher re-latches the static transforms of every
  # publisher on the other side, and a late joiner only gets the last <depth>.
  tf_static:
    type: tf2_msgs/msg/TFMessage
    bidirectional: true
    qos:
      reliability: reliable
      durability: transient_local
      history: keep_last
      depth: 100

  # The boat's GPS. jit_datum_node on the sub reads it (remapped from
  # /junior/fix) to anchor map -> jit/local_origin.
  gps/fix:
    type: sensor_msgs/msg/NavSatFix

  # ---- sub -> shared ------------------------------------------------------

  # infrastructure_node: task end (DONE / FAILED) and the survey report.
  jit/task/state:
    type: std_msgs/msg/String
    reversed: true
  robotx_comm/jit/tx_pipeline:
    type: robotx_comm/msg/PipeLineSurveyReport
    reversed: true

  # heartbeat_node: current task, vehicle state, position, heading, speed.
  jit/task/active:
    type: std_msgs/msg/Bool
    reversed: true
  jit/mode:
    type: jit_msgs/msg/Mode
    reversed: true
  jit/health:
    type: jit_msgs/msg/Health
    reversed: true

  # heartbeat_node and infrastructure_node (sub pose for the plan request).
  mavros/local_position/pose:
    type: geometry_msgs/msg/PoseStamped
    reversed: true
  mavros/local_position/velocity_local:
    type: geometry_msgs/msg/TwistStamped
    reversed: true
  mavros/global_position/global:
    type: sensor_msgs/msg/NavSatFix
    reversed: true
